[tool.poetry]
name = "ozon-test-task"
version = "0.1.0"
description = "Автоматизация кабинета Ozon через AdsPower Local API + оптимизация тяжёлых таблиц"
authors = ["Egor Kurlenko <e.kurlenko@prime.su>"]
readme = "README.md"
packages = [
    { include = "config", from = "src" },
    { include = "adspower", from = "src" },
    { include = "sheets", from = "src" },
]

[tool.poetry.dependencies]
python = "^3.12"
requests = "^2.32"
pandas = "^2.2"
google-api-python-client = "^2.147"
google-auth = "^2.35"
tenacity = "^9.0"
pandas-stubs = "~=2.3.3"
python-dotenv = "^1.2.3"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3"
responses = "^0.25"
ruff = "^0.6"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E", "W",    # pycodestyle
    "F",         # pyflakes
    "I",         # сортировка импортов
    "N",         # имена
    "UP",        # устаревшие конструкции
    "B",         # ловушки bugbear
    "A",         # затенение встроенных имён
    "C4",        # лишние comprehension
    "SIM",       # упрощения
    "RET",       # возвраты
    "PT",        # стиль pytest
    "ARG",       # неиспользуемые аргументы
    "PD",        # антипаттерны pandas
    "PL",        # pylint
    "TCH",       # импорты только для типов
    "S",         # безопасность
    "T20",       # забытые print
    "RUF",
]
ignore = [
    # Имена исключений: базовое AdsPowerError оканчивается на Error, потомки
    # названы по причине отказа — так читается лучше, чем ApiDownError.
    "N818",
    # Тексты ошибок пишем на месте: выносить каждую строку в переменную ради
    # правила — терять читаемость сообщения.
    "EM101", "EM102", "TRY003",
    # Кириллица в строках — это не «похожие на латиницу символы».
    "RUF001", "RUF002", "RUF003",
]

[tool.ruff.lint.per-file-ignores]
# assert — язык pytest; обращение к приватным методам в тестах осознанно;
# числа в проверках — это и есть ожидаемые значения.
"tests/*" = ["S101", "SLF001", "PLR2004"]
# CLI печатает результат в stdout — в этом его работа.
"src/*/main.py" = ["T201"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
