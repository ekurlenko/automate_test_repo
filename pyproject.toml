[tool.poetry]
name = "ozon-test-task"
version = "0.1.0"
description = "Автоматизация кабинета Ozon через AdsPower Local API + оптимизация тяжёлых таблиц"
authors = ["Egor Kurlenko <e.kurlenko@prime.su>"]
readme = "README.md"
packages = [{ include = "ozon_test", from = "src" }]

[tool.poetry.dependencies]
python = "^3.12"
requests = "^2.32"
pandas = "^2.2"
pyarrow = "^17.0"
playwright = "^1.47"
google-api-python-client = "^2.147"
google-auth = "^2.35"
tenacity = "^9.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3"
responses = "^0.25"
ruff = "^0.6"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
